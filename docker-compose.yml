services:
  mqtt:
    build: ./mqtt
    restart: unless-stopped
    environment:
      HEISHAMON_MQTT_USERNAME: ${HEISHAMON_MQTT_USERNAME:?set in .env}
      HEISHAMON_MQTT_PASSWORD: ${HEISHAMON_MQTT_PASSWORD:?set in .env}
      APP_MQTT_USERNAME: ${APP_MQTT_USERNAME:?set in .env}
      APP_MQTT_PASSWORD: ${APP_MQTT_PASSWORD:?set in .env}
      ZIGBEE2MQTT_MQTT_USERNAME: ${ZIGBEE2MQTT_MQTT_USERNAME:?set in .env}
      ZIGBEE2MQTT_MQTT_PASSWORD: ${ZIGBEE2MQTT_MQTT_PASSWORD:?set in .env}
    ports:
      - "1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$APP_MQTT_USERNAME\" -P \"$$APP_MQTT_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 5"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 5s

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_PATH: /app/data/kotialy.db
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-panasonic_heat_pump}
      MQTT_USERNAME: ${APP_MQTT_USERNAME:?set in .env}
      MQTT_PASSWORD: ${APP_MQTT_PASSWORD:?set in .env}
      ZIGBEE_MQTT_HOST: mqtt
      ZIGBEE_MQTT_PORT: 1883
      ZIGBEE_BASE_TOPIC: ${ZIGBEE_BASE_TOPIC:-zigbee2mqtt}
      ZIGBEE_MQTT_USERNAME: ${APP_MQTT_USERNAME:?set in .env}
      ZIGBEE_MQTT_PASSWORD: ${APP_MQTT_PASSWORD:?set in .env}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-kotialy}
      AUTH_VIEWER_USERNAME: ${AUTH_VIEWER_USERNAME:-viewer}
      AUTH_VIEWER_PASSWORD: ${AUTH_VIEWER_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-kotialy_default_secret_key_change_in_production}
      AUTH_TOKEN_DAYS: ${AUTH_TOKEN_DAYS:-365}
      CAMERA_ENABLED: ${CAMERA_ENABLED:-true}
      CAMERA_NAME: ${CAMERA_NAME:-Pannuhuone / Tekninen tila}
      CAMERA_RTSP_URL: ${CAMERA_RTSP_URL:-}
      CAMERA_MAIN_RTSP_URL: ${CAMERA_MAIN_RTSP_URL:-}
      HERRFORS_ENABLED: ${HERRFORS_ENABLED:-true}
      HERRFORS_CO_ID: ${HERRFORS_CO_ID:-}
      HERRFORS_USERNAME: ${HERRFORS_USERNAME:-}
      HERRFORS_PASSWORD: ${HERRFORS_PASSWORD:-}
      HERRFORS_SESSION_TOKEN: ${HERRFORS_SESSION_TOKEN:-}
      HERRFORS_REFRESH_INTERVAL_MINUTES: ${HERRFORS_REFRESH_INTERVAL_MINUTES:-5}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-r2}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_PREFIX: ${R2_PREFIX:-kotialy/}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-10}
    volumes:
      - server-data:/app/data
    depends_on:
      mqtt:
        condition: service_healthy

  dashboard:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  openvpn:
    build: ./openvpn
    container_name: kotialy-openvpn
    restart: unless-stopped
    ports:
      - "1194:1194/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - openvpn-data:/etc/openvpn

volumes:
  mqtt-data:
  server-data:
  openvpn-data:
    external: true
