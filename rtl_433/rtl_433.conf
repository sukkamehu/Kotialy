# rtl_433 configuration for Kotiäly
# https://github.com/merbanan/rtl_433

# Tuning frequency (default 433.92 MHz for standard European temperature/humidity/climate sensors)
frequency 433.92M

# Convert all readings to SI units (Celsius, mm, km/h, hPa)
convert si

# Report metadata (ISO timestamp & decoded protocol)
report_meta time:iso
report_meta protocol

# Automatic tuner gain
gain auto

# Uncomment to filter only specific protocols if desired, e.g.:
# protocol 40   # Acurite 592TXR Temp/Humidity
# protocol 12   # Oregon Scientific
# protocol 19   # Nexus, TFA
# By default without protocol filters, all ~200+ protocols are enabled.

# Optional: Frequency hopping (e.g. between 433.92 MHz and 868.3 MHz every 30s):
# hop_interval 30
# frequency 433.92M
# frequency 868.3M

